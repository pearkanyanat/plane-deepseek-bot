name: Plane daily report

# 09:00 เวลาไทย = 02:00 UTC · จันทร์–ศุกร์
on:
  schedule:
    - cron: "0 2 * * 1-5"
  workflow_dispatch:

concurrency:
  group: plane-daily
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Post health report
        env:
          PLANE_URL: https://plane-wubbvrdcisw9wzkxth2tditj.coolify-app-2.thit.io
          PLANE_WORKSPACE: thzi-gtm
          PLANE_PROJECT_ID: 5e7d126a-3a15-4666-9996-96174d4d7f93
          PLANE_API_KEY: ${{ secrets.PLANE_API_KEY }}
          HUB_ISSUE_ID: 90d0f8e0-2724-4a40-8bb8-41ba12b4d0c4
          STALE_DAYS: "5"
          AGING_DAYS: "14"
        run: python -c "import sys; sys.path.insert(0, 'service'); import report; sys.exit(0 if report.run_daily_report() else 1)"
